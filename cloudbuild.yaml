steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/forge-docs-repo/${_SERVICE_NAME}:$BUILD_ID', '.']

  # 2. Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/forge-docs-repo/${_SERVICE_NAME}:$BUILD_ID']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/forge-docs-repo/${_SERVICE_NAME}:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--set-secrets=FORGE_DOCS_TOKEN=FORGE_DOCS_TOKEN:latest'
      - '--set-env-vars=WORKSPACE_DOMAIN=${_WORKSPACE_DOMAIN},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,DEFAULT_PARENT_FOLDER_ID=${_DEFAULT_FOLDER},DEFAULT_SERVICE_ACCOUNTS=${_DEFAULT_SA}'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/forge-docs-repo/${_SERVICE_NAME}:$BUILD_ID'

substitutions:
  _SERVICE_NAME: forgedocs
  _REGION: us-central1
  _WORKSPACE_DOMAIN: supportmendoza.com
  _DEFAULT_FOLDER: 1wpPCQCqXlHmWTCe0aUe9-P1LlR2sjNAQ
  _DEFAULT_SA: drive-sheets@ortega-473114.iam.gserviceaccount.com,sa-transcriptor@ortega-473114.iam.gserviceaccount.com,docs-writer-sa@ortega-473114.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
